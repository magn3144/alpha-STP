max_tune_length: 2048

model_name_or_path: "deepseek-ai/deepseek-coder-1.3b-base"
tokenizer_name_or_path: "deepseek-ai/deepseek-coder-1.3b-base"
trust_remote_code: True

trainer:
  tracker:
    type: wandb
    entity: magn3144
    project: "STP_deepseek"
    name: "deepseek-sft"
    tags: ["deepseek-ai/deepseek-coder-1.3b-base", "STP"]

  mp: p=f32,c=bfloat16

  # Two GPUs x 14 examples/device x 5 accumulation steps = 140 examples/update.
  train_batch_size: 140
  num_train_steps: 144
  steps_per_eval: 40

  tensor_parallel_axes: ["mlp", "heads"]
  per_device_eval_parallelism: 14
  per_device_parallelism: 14
# Export at steps 40, 80, 120, and the final step 143.
save_freq: 40
eval_on_first_step: False

optimizer:
  learning_rate: 3e-5
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  epsilon: 1E-5
  warmup: 10
  min_lr_ratio: 1.0
