[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-stp"
version = "0.1.0"
description = "Single-GPU PyTorch implementation of the Self-play Theorem Prover"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alphaproof; sys_platform != 'darwin'",
    "huggingface-hub",
    "leantree",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "torch==2.12.1",
    "tqdm>=4.67.0",
    "transformers",
]

[project.scripts]
stp = "stp.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
]

[tool.uv.sources]
alphaproof = { path = "../delta-proof", editable = true }
leantree = { path = "../delta-proof/vendor/leantree", editable = true }
transformers = { git = "https://github.com/huggingface/transformers.git" }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv.workspace]
exclude = ["../delta-proof"]

[[tool.uv.dependency-metadata]]
name = "alphaproof"
version = "0.1.0"
requires-python = ">=3.13"
requires-dist = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
    "datasets>=4.0.0",
    "leantree",
    "lm-format-enforcer>=0.11.0",
    "matplotlib>=3.10.0",
    "pandas>=3.0.0",
    "torch==2.12.1",
    "transformers",
    "wandb>=0.28.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["stp"]

[tool.pyright]
include = ["stp"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
