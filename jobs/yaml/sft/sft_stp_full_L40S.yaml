experiment:
  type: sft
  run_dir: "${DATA}/runs/sft_stp_full_deepseek_coder_1.3b_l40s"
  train_data: "${DATA}/dataset/prover_sft/mathlib_leanworkbook.json"
  validation_data: "${DATA}/dataset/prover_sft/eval.json"
  base_model: "data/models/deepseek-coder-1.3b-base"

training:
  max_tune_length: 2048
  trust_remote_code: true

  trainer:
    ray:
      auto_start_cluster: false
    tracker:
      type: wandb
      entity: s204164-danmarks-tekniske-universitet-dtu
      project: alpha-STP
      name: deepseek-sft-stp-full
      tags: [deepseek-ai/deepseek-coder-1.3b-base, sft, STP, full-dataset, L40S]

    seed: 0
    mp: p=f32,c=bfloat16
    train_batch_size: 20
    model_axis_size: 1
    num_train_steps: 11772
    steps_per_eval: 500
    max_eval_batches: 52
    tensor_parallel_axes: [mlp, heads]
    per_device_eval_parallelism: 20
    per_device_parallelism: 20

  # One epoch, rounding up: 235,430 examples / 20; final export at step 11771.
  save_freq: 1472
  eval_on_first_step: false

  optimizer:
    learning_rate: 2.0e-7
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-5
    max_grad_norm: 1.0
    lr_schedule: cosine
    warmup: 1177
    stable: 0.0
    cooldown: 0.0
    min_lr_ratio: 1.0
