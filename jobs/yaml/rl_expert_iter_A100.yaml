experiment:
  type: expert_iteration
  exp_dir: "${STORAGE}/Expit_LeanWorkbook"
  base_model: deepseek-ai/DeepSeek-Prover-V1.5-SFT
  dataset_config: RL/dataset_configs/leanworkbook.json
  dataset_size: 0
  total_rounds: 12
  seed: 0
  samples_per_statement: 64
  temperature: 1.0
  epochs: 1
  sampler: Sampler_naive

training:
  max_tune_length: 2048
  trust_remote_code: true

  trainer:
    ray:
      auto_start_cluster: false
    tracker:
      type: wandb
      entity: s204164-danmarks-tekniske-universitet-dtu
      project: alpha-STP
      name: deepseek-expert-iteration
      tags: [DeepSeek-Prover-V1.5-SFT, expert-iteration, LeanWorkbook]

    seed: 0
    mp: p=f32,c=bfloat16
    train_batch_size: 32
    steps_per_eval: 100
    tensor_parallel_axes: [mlp, heads]
    per_device_eval_parallelism: 16
    per_device_parallelism: 16

  eval_on_first_step: false

  optimizer:
    learning_rate: 6.25e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-5
    max_grad_norm: 1.0
    lr_schedule: cosine
    stable: 0.0
    cooldown: 0.0
    min_lr_ratio: 1.0
