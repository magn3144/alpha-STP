max_tune_length: 2048
trust_remote_code: True
hf_save_path: null
eval_data: null

trainer:
  ray:
    auto_start_cluster: false
  tracker:
    type: wandb
    mode: disabled
  mp: p=f32,c=bfloat16
  train_batch_size: 2
  num_train_steps: 100000
  steps_per_eval: 100000
  tensor_parallel_axes: ["mlp", "heads"]
  per_device_eval_parallelism: 1
  per_device_parallelism: 1
  checkpointer:
    save_interval: 24h
    keep: []

eval_on_first_step: False

optimizer:
  learning_rate: 4.4194e-6
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  epsilon: 1E-5
  warmup: 100
  min_lr_ratio: 1.0
