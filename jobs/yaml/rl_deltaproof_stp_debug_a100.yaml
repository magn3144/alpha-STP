# Interactive debugging: 8 search simulations per game, 16 games per round.
# Two rounds allow stepping through conjecture generation and training.
experiment:
  type: rl
  exp_dir: ${STORAGE}/DeltaProof/STP_debug_one_tactic_a100
  conjecturer_model: ${STORAGE}/Conjecturer/SFT/9w7a7leb/step-2563
  conjecturer_sft_dataset: ${STORAGE}/Conjecturer/data/SFT/train.json
  dataset_size: 32
  total_rounds: 2
  temperature: 1.0
  epochs: 1
  sampler: Sampler_base
  conjecture_multiplier: 2
  solver:
    type: deltaproof
    repo_dir: ${DELTA_PROOF}
    python: ${DELTA_PROOF}/.venv/bin/python
    config: ${STORAGE}/../jobs/yaml/alphaproof_debug_a100.yaml
    sft_run_dir: ${DELTA_PROOF}/data/runs/sft_codet5p_770m_l40s_1_8_01
    run_dir: ${STORAGE}/DeltaProof/AlphaProof_debug_one_tactic_a100
    dataset_path: ${STORAGE}/../assets/data/debug/one_tactic.jsonl
    lean_project: ${DELTA_PROOF}/lean_project
    lake_path: ${HOME}/.elan/bin/lake
    imports:
    - Mathlib
    attempts_per_round: 16
    conjecture_attempts: 8
    conjecture_fraction: 0.5
    learner_steps_per_round: 2
    num_simulations: 8
    num_sampled_actions: 6
    tactic_timeout: 1.0
    final_check_timeout: 300.0
    parallel_searches: 1
    max_concurrent_lean_imports: 1
    inference_num_gpus: 1
    inference_batch_size: 1
    inference_batch_timeout: 0.05
training:
  max_tune_length: 2048
  trust_remote_code: true
  trainer:
    ray:
      auto_start_cluster: false
    tracker:
      type: wandb
      entity: s204164-danmarks-tekniske-universitet-dtu
      project: alpha-STP
      name: deltaproof-stp-debug-a100
      tags:
      - DeltaProof
      - STP
      - codet5p-770m
      - NuminaMath
      - 1-8
    seed: 0
    mp: p=f32,c=bfloat16
    train_batch_size: 2
    steps_per_eval: 100
    tensor_parallel_axes:
    - mlp
    - heads
    per_device_eval_parallelism: 1
    per_device_parallelism: 1
  eval_on_first_step: false
  optimizer:
    learning_rate: 6.25e-06
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-05
    max_grad_norm: 1.0
    lr_schedule: cosine
    stable: 0.0
    cooldown: 0.0
    min_lr_ratio: 1.0
