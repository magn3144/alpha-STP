experiment:
  type: rl
  exp_dir: "${DATA}/runs/expert_iteration_deltaproof_codet5p_770m_l40s_1_8"
  dataset_size: 0
  total_rounds: 10
  conjecture_multiplier: 10
  deltaproof:
    conjecturer_model: "${DATA}/runs/sft_conjecturer_deepseek_coder_1.3b_a100/models/9w7a7leb/step-2563"
    vllm_gpu_memory_utilization: 0.85
    conjecturer_sft_dataset: "${DATA}/dataset/conjecturer_sft/train.json"
    conjecturer_sft_ratio: 5
    conjecturer_temperature: 1.0
    conjecturer_epochs: 1
    repo_dir: "${DELTA_PROOF}"
    python: "${DELTA_PROOF}/.venv/bin/python"
    dataset_path: "${DELTA_PROOF}/data/dataset/numina_math_lean_passing_1_8/train.jsonl"
    lean_project: "${DELTA_PROOF}/lean_project"
    lake_path: "${HOME}/.elan/bin/lake"
    imports: [Mathlib]
    attempts_per_round: 4800
    conjecture_attempts: 16
    conjecture_fraction: 0
    learner_steps_per_round: 500

training:
  max_tune_length: 2048
  trust_remote_code: true

  trainer:
    ray:
      auto_start_cluster: false
    tracker:
      type: wandb
      entity: s204164-danmarks-tekniske-universitet-dtu
      project: alpha-STP
      name: deltaproof-expert-codet5p-770m-l40s-1-8
      tags: [DeltaProof, expert-iteration, codet5p-770m, NuminaMath, L40S, 1-8]

    seed: 0
    mp: p=f32,c=bfloat16
    train_batch_size: 32
    steps_per_eval: 100
    model_axis_size: 1
    tensor_parallel_axes: [mlp, heads]
    per_device_eval_parallelism: 16
    per_device_parallelism: 16

  eval_on_first_step: false

  optimizer:
    learning_rate: 6.25e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.95
    epsilon: 1.0e-5
    max_grad_norm: 1.0
    lr_schedule: cosine
    stable: 0.0
    cooldown: 0.0
    min_lr_ratio: 1.0

deltaproof:
  # SFT on 1/8 data, followed by RL initialized from this SFT run.
  sft:
    train_input: data/dataset/sft_1_8/train.jsonl
    validation_input: data/dataset/sft_1_8/validation.jsonl
    model: data/models/Salesforce--codet5p-770m
    epochs: 1
    checkpoints_per_epoch: 1
    num_pairs: null
    num_validation_pairs: null
    batch_size: 16
    learning_rate: 5.0e-5
    value_weight: 0.01
    max_state_length: 640
    max_action_length: 128
    num_value_bins: 64
    max_grad_norm: 1.0
    log_every: 100
    validation_interval: 500
    validation_samples: 512
    wandb_project: alphaproof
    wandb_name: null
    wandb_mode: online
    seed: 0
    device: auto
    dtype: bfloat16

  rl:
    num_simulations: 64
    batch_size: 10
    num_actors: 96
    num_games_per_actor: 500  # Unused by STP + DeltaProof.
    max_concurrent_lean_imports: 24
    inference_num_gpus: 1
    inference_batch_size: 30
    inference_batch_timeout: 0.05
    num_sampled_actions: 6
    tactic_timeout: 1.0
    final_check_timeout: 300.0
    seed: 0
    debug: false
    lr: 1.0e-5
    dtype: float32
    tokenizer_model: data/models/Salesforce--codet5p-770m  # Unused; sft_run_dir/model_source overrides it.
    dataset_dir: data/dataset/numina_math_lean_passing_1_8
    sft_dataset_path: data/dataset/sft_1_8/train.jsonl
    sft_fraction: 0.1
    disprove_rate: 0.0  # Unused by STP + DeltaProof.
    sft_run_dir: data/runs/sft_codet5p_770m_l40s_1_8_01
    max_state_length: 640
    max_action_length: 128
    rollout_max_action_length: 32
    training_steps: 10000  # Unused; learner_steps_per_round controls training steps.
    training_iterations: 100  # Unused by STP + DeltaProof.
    checkpoint_interval: 250
    window_size: 250000
    value_weight: 0.01
    validation_fraction: 0.05
    validation_batch_size: 10
    validation_interval: 100
    theorem_validation_interval_games: 2400  # Unused by STP + DeltaProof.
    theorem_validation_num_theorems: 384  # Unused by STP + DeltaProof.
    log_interval: 10
    reward_window: 100
    wandb_project: alphaproof
    wandb_entity: s204164-danmarks-tekniske-universitet-dtu
    wandb_tags: []
    wandb_name: null
    wandb_mode: online
    pb_c_base: 200
    pb_c_init: 0.001
    value_discount: 0.98
    prior_temperature: 200
    c_and: 64
    unvisited_value_penalty: 16
    no_legal_actions_value: -5
    ps_c: 0.1
    ps_alpha: 0.6
    num_value_bins: 64
    mm_trust_count: 4  # Unused by STP + DeltaProof.
    mm_fully_decided_trust_count: 6  # Unused by STP + DeltaProof.
    mm_proved_weight: 0.001  # Unused by STP + DeltaProof.
    mm_undecided_weight: 0.1  # Unused by STP + DeltaProof.
    mm_simulation_failure_window: 4  # Unused by STP + DeltaProof.
    mm_simulation_failure_multiplier: 1.5  # Unused by STP + DeltaProof.
    mm_max_num_simulations: 1024  # Unused by STP + DeltaProof.
